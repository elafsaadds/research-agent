[project]
name = "research-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "rank-bm25>=0.2.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "gradio>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio", "ruff"]
anthropic = ["anthropic"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
